version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6
    container_name: lms-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: lmspassword2026
      MONGO_INITDB_DATABASE: lms
    volumes:
      - mongodb_data:/data/db
    networks:
      - lms-network

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: lms-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lms-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - MONGO_URI=mongodb://admin:lmspassword2026@mongodb:27017/lms?authSource=admin
      - REDIS_URL=redis://redis:6379
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - lms-network
    command: npm run dev

  # Admin Portal
  admin-portal:
    build:
      context: ./admin-portal
      dockerfile: Dockerfile.dev
    container_name: lms-admin-portal
    restart: always
    ports:
      - "3001:3001"
    environment:
      - VITE_API_URL=http://localhost:5000
    volumes:
      - ./admin-portal:/app
      - /app/node_modules
    networks:
      - lms-network
    command: npm run dev -- --host 0.0.0.0 --port 3001

  # Tutor Portal
  tutor-portal:
    build:
      context: ./tutor-portal
      dockerfile: Dockerfile.dev
    container_name: lms-tutor-portal
    restart: always
    ports:
      - "3002:3002"
    environment:
      - VITE_API_URL=http://localhost:5000
    volumes:
      - ./tutor-portal:/app
      - /app/node_modules
    networks:
      - lms-network
    command: npm run dev -- --host 0.0.0.0 --port 3002

  # Candidate Portal
  candidate-portal:
    build:
      context: ./candidate-portal
      dockerfile: Dockerfile.dev
    container_name: lms-candidate-portal
    restart: always
    ports:
      - "3003:3003"
    environment:
      - VITE_API_URL=http://localhost:5000
    volumes:
      - ./candidate-portal:/app
      - /app/node_modules
    networks:
      - lms-network
    command: npm run dev -- --host 0.0.0.0 --port 3003

volumes:
  mongodb_data:
  redis_data:

networks:
  lms-network:
    driver: bridge
